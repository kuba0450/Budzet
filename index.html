<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budżet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mój Budżet</title>
<style>
:root{
  --bg:#f4f5fb; --card:#ffffff; --card2:#f1f3f9; --text:#0f172a; --muted:#64748b; --line:#e5e8f0;
  --c-full:#6366f1; --c-free:#10b981; --c-plan:#f59e0b; --c-save:#0ea5e9; --c-exp:#f43f5e; --c-cash:#16a34a;
  /* kolory kategorii (stała kolejność) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --s0:#94a3b8; --sx:#cbd5e1;
  --bar-on:#2a78d6; --bar-off:#b7d3f6;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px rgba(15,23,42,.06);
  --radius:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1020; --card:#151b2e; --card2:#1d2439; --text:#e8ecf5; --muted:#8b95ab; --line:#252d45;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --s0:#64748b; --sx:#3b465e;
    --bar-on:#3987e5; --bar-off:#1c3d6b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 18px;gap:10px}
.top h1{font-size:26px;margin:0;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.pill{padding:10px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:650;font-size:14px;flex:0 0 auto}
.pill.pri{background:var(--c-plan);color:#fff}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);text-align:left;
  display:flex;flex-direction:column;gap:10px;transition:transform .12s;position:relative;overflow:hidden;min-height:118px}
.tile:active{transform:scale(.97)}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:color-mix(in srgb,var(--c) 15%,transparent)}
.tile .lb{font-size:13px;color:var(--muted);font-weight:600}
.tile .am{font-size:20px;font-weight:750;letter-spacing:-.02em;margin-top:auto;word-break:break-word}
.tile .sub{font-size:12px;color:var(--muted);margin-top:-6px}
.tile::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;
  background:color-mix(in srgb,var(--c) 10%,transparent)}
.tile.big{grid-column:1/-1;background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7);color:#fff;min-height:auto;padding:20px}
.tile.big::after{background:rgba(255,255,255,.08);width:160px;height:160px;right:-50px;top:-60px}
.tile.big .lb{color:rgba(255,255,255,.85)}
.tile.big .am{font-size:34px;margin-top:2px}
.tile.big .ic{background:rgba(255,255,255,.18)}
.tile .neg{color:var(--c-exp)}
.tile.big .neg{color:#ffd1da}
.seg-bar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.2);margin-top:4px}
.seg-bar span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.9)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tile .hint{position:absolute;right:14px;bottom:14px;font-size:18px;opacity:.35}

.cash{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;background:var(--card);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);text-align:left;border:1.5px dashed color-mix(in srgb,var(--c-cash) 45%,transparent)}
.cash:active{transform:scale(.98)}
.cash .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c-cash) 15%,transparent)}
.cash .t{flex:1}
.cash .t b{display:block;font-size:14px}
.cash .t small{color:var(--muted);font-size:12px}
.cash .v{font-size:19px;font-weight:750}

/* sections */
.sec{margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.sec-h h2{font-size:17px;margin:0}
.sec-h button{color:var(--c-full);font-weight:600;font-size:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px}
.goals-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px}
.goals-scroll::-webkit-scrollbar{display:none}
.goal-chip{flex:0 0 auto;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;width:150px;text-align:left}
.goal-chip .e{font-size:24px}
.goal-chip b{display:block;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-chip small{font-size:12px;color:var(--muted)}
.prog{height:7px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;border-radius:9px;background:var(--c-plan);transition:width .4s}
.prog.done span{background:var(--c-free)}

/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;text-align:left}
button.row:active{background:var(--card2)}
.ri{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;font-size:20px;
  background:color-mix(in srgb,var(--c) 14%,transparent)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--muted);font-size:12.5px}
.ra{font-weight:700;font-size:15px;white-space:nowrap}
.ra.pos{color:var(--c-free)} .ra.neg{color:var(--c-exp)} .ra.save{color:var(--c-save)} .ra.mut{color:var(--muted)} .ra.plan{color:var(--c-plan)}
.empty{text-align:center;color:var(--muted);padding:26px 16px;font-size:14px}
.empty .e{font-size:34px;display:block;margin-bottom:6px}

/* goals view */
.gsum{background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.gsum small{opacity:.9;font-weight:600;font-size:13px}
.gsum .v{font-size:30px;font-weight:750;letter-spacing:-.02em;margin:2px 0}
.gsum .v span{font-size:16px;opacity:.85;font-weight:600}
.gsum .prog{background:rgba(255,255,255,.25)} .gsum .prog span{background:#fff}
.gsum p{margin:10px 0 0;font-size:13px;opacity:.95}
.gcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:12px}
.gcard .gh{display:flex;align-items:center;gap:12px}
.gcard .ge{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:color-mix(in srgb,var(--c-plan) 15%,transparent)}
.gcard .gt{flex:1;min-width:0}
.gcard .gt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gt small{color:var(--muted);font-size:13px}
.gcard .pct{font-weight:750;font-size:17px}
.gcard .prog{height:10px;margin-top:14px}
.gcard .gi{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.gcard .gb{display:flex;gap:8px;margin-top:14px}
.gcard .gb button{flex:1;padding:11px;border-radius:13px;font-weight:650;font-size:14px;background:var(--card2)}
.gcard .gb .dep{background:var(--c-plan);color:#fff}
.gcard.done .ge{background:color-mix(in srgb,var(--c-free) 15%,transparent)}
.gdash{padding:14px}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gstats div{background:var(--card2);border-radius:13px;padding:10px 10px}
.gstats small{display:block;color:var(--muted);font-size:11.5px;font-weight:600}
.gstats b{font-size:16px;letter-spacing:-.01em}
.pin{margin-top:12px;border:1.5px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.pin:active{background:var(--card2)}
.pin-h{display:flex;align-items:center;gap:10px}
.pin-h .ge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c-plan) 15%,transparent)}
.pin-h .gt{flex:1;min-width:0}
.pin-h .gt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-h .gt small{color:var(--muted);font-size:12.5px}
.pick{padding:8px 11px;border-radius:11px;background:var(--card2);font-weight:650;font-size:13px;color:var(--c-plan);flex:0 0 auto}
.pin .gi{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.gdash-empty{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.gdash-empty>span:first-child{font-size:26px}
.gdash-empty b{display:block;font-size:15px}.gdash-empty small{color:var(--muted);font-size:12.5px}
.gdash-empty>span:nth-child(2){flex:1}
.gdash-empty .plus{font-size:22px;color:var(--c-plan);font-weight:700}
.src{margin-top:14px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--c-free) 16%,transparent);color:var(--c-free)}

/* analysis */
.donut-wrap{display:flex;flex-direction:column;align-items:center;padding:18px 10px 8px}
.donut{width:220px;height:220px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.donut circle.seg{fill:none;stroke-width:26;transition:stroke-width .15s,opacity .15s;cursor:pointer}
.donut circle.seg.dim{opacity:.3}
.donut circle.seg.hl{stroke-width:32}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 46px}
.donut .ctr small{color:var(--muted);font-size:12.5px;font-weight:600;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut .ctr b{font-size:21px;letter-spacing:-.02em}
.donut .ctr span{color:var(--muted);font-size:12px}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;border-radius:14px;text-align:left}
.crow:active{background:var(--card2)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.crow .e{font-size:20px;width:26px;text-align:center}
.crow .n{flex:1;min-width:0}
.crow .n b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .n small{color:var(--muted);font-size:12px}
.crow .v{text-align:right}
.crow .v b{display:block;font-size:14.5px}
.crow .v small{color:var(--muted);font-size:12px}
.crow .track{height:5px;border-radius:9px;background:var(--card2);margin-top:6px;overflow:hidden}
.crow .track span{display:block;height:100%;border-radius:4px}
.bars6{display:flex;align-items:flex-end;gap:8px;height:150px;padding:28px 6px 0}
.bars6 button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;position:relative}
.bars6 .b{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--bar-off);min-height:2px}
.bars6 button.on .b{background:var(--bar-on)}
.bars6 .ml{font-size:11.5px;color:var(--muted);font-weight:600}
.bars6 button.on .ml{color:var(--text)}
.bars6 .bv{position:absolute;font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--text)}
.baseline{height:1px;background:var(--line);margin:0 6px}
.note{color:var(--muted);font-size:12.5px;margin:12px 4px 0;line-height:1.45}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line)}
.nav-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
.nav-b{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.nav-b svg{width:23px;height:23px}
.nav-b.on{color:var(--c-full)}
.fab{flex:0 0 56px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#f43f5e,#fb7185);color:#fff;
  font-size:30px;line-height:1;box-shadow:0 8px 20px rgba(244,63,94,.4);margin:-26px 6px 0;display:grid;place-items:center}
.fab:active{transform:scale(.94)}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(5,8,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:26px 26px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s;max-width:560px;margin:0 auto}
.sheet.on{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px}
.sh-h h3{margin:0;font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--card);font-size:16px;color:var(--muted)}
.bal{background:var(--card);border-radius:18px;padding:14px 16px;margin:10px 0 16px;box-shadow:var(--shadow);border-left:5px solid var(--c)}
.bal small{color:var(--muted);font-weight:600;font-size:13px}
.bal div{font-size:28px;font-weight:750;letter-spacing:-.02em}
.bal p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 6px}
.in{width:100%;padding:14px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;outline:none}
.in:focus{border-color:var(--c,var(--c-full))}
.in.amt{font-size:24px;font-weight:700}
.amtwrap{position:relative}
.amtwrap span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.btn{width:100%;margin-top:16px;padding:15px;border-radius:15px;background:var(--c,var(--c-full));color:#fff;font-weight:700;font-size:16px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--card);color:var(--c-exp);box-shadow:var(--shadow)}
.btn.sec2{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btn+.btn{margin-top:10px}
.err{color:var(--c-exp);font-size:13px;margin:8px 2px 0;min-height:1em}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:10px 4px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--c);color:#fff}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;font-size:21px;background:var(--card);display:grid;place-items:center}
.emojis button.on{background:color-mix(in srgb,var(--c) 22%,var(--card));outline:2px solid var(--c)}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cats button{padding:9px 13px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.cats button .dot{width:8px;height:8px;flex-basis:8px}
.cats button.on{outline:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.cats button.add{color:var(--c-full);box-shadow:none;border:1.5px dashed var(--line)}
.quick{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.quick button{padding:8px 14px;border-radius:99px;background:var(--card);font-weight:600;font-size:13.5px;box-shadow:var(--shadow)}
.list-h{font-size:13px;font-weight:700;color:var(--muted);margin:22px 4px 6px;text-transform:uppercase;letter-spacing:.04em}
.acts{display:flex;gap:6px}
.acts button{width:36px;height:36px;border-radius:11px;background:var(--card2);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.grid2 .btn{margin-top:0}

/* history */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:99px;background:var(--card);font-weight:600;font-size:14px;box-shadow:var(--shadow);color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg)}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;margin:14px 0;box-shadow:var(--shadow)}
.month button{width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--muted)}
.month button:disabled{opacity:.25}
.month b{font-size:15px}
.month .all{width:auto;padding:0 12px;font-size:13px;font-weight:600;color:var(--c-full)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border-top:4px solid var(--c)}
.sum small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.sum b{font-size:18px;letter-spacing:-.01em}
.sum em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}
.day{font-size:13px;font-weight:700;color:var(--muted);margin:18px 6px 6px}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;
  transition:.25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
.detail{text-align:center;padding:10px 0 4px}
.detail .e{font-size:46px}
.detail h4{margin:6px 0 2px;font-size:20px}
.detail .v{font-size:28px;font-weight:750;margin:6px 0}
.detail p{color:var(--muted);margin:0;font-size:14px}
@media (min-width:600px){.sheet{border-radius:26px;bottom:20px}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<nav class="nav">
  <div class="nav-in">
    <button class="nav-b on" data-view="dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
      Pulpit
    </button>
    <button class="nav-b" data-view="goals">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      Cele
    </button>
    <button class="fab" id="fab" aria-label="Dodaj wydatek">+</button>
    <button class="nav-b" data-view="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
      Analiza
    </button>
    <button class="nav-b" data-view="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      Historia
    </button>

</nav>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* =====================================================================
   STAN I ZAPIS
   ===================================================================== */
const KEY = 'budzet-v1';
const DEFAULT_CATS = [
  ['🛒','Jedzenie i zakupy'], ['🚗','Transport'], ['🏠','Dom i rachunki'],
  ['🎮','Rozrywka'], ['💊','Zdrowie'], ['👕','Ubrania'],
];
let S = load();
let view = 'dash';
const H = { cat: 'all', month: monthKey(new Date()) };   // historia
const A = { month: monthKey(new Date()), hl: null };     // analiza

function fresh(){
  return { v:2, tx:[], goals:[], cats: DEFAULT_CATS.map(([e,n],i) => ({ id: uid(), name:n, emoji:e, slot:i })) };
}
function migrate(d){
  if(!d || !Array.isArray(d.tx) || !Array.isArray(d.goals)) return null;
  // v1 -> v2: cele miały tylko "amount" (cała kwota zarezerwowana)
  d.goals = d.goals.map(g => g.target === undefined
    ? { id:g.id, name:g.name, emoji:g.emoji, target:g.amount, saved:g.amount, created:g.created }
    : g);
  if(!Array.isArray(d.cats)) d.cats = fresh().cats;
  syncGoals(d);
  d.v = 2;
  return d;
}
function load(){
  try{ const d = migrate(JSON.parse(localStorage.getItem(KEY))); if(d) return d; }catch(e){}
  return fresh();
}
// stan celu = suma faktycznych wpłat minus wycofania, osobno z karty i z gotówki
function syncGoals(d){
  d = d || S;
  for(const g of d.goals){
    let card = 0, cash = 0;
    for(const t of d.tx){
      if(t.goalId !== g.id || (t.type !== 'goal_dep' && t.type !== 'goal_wd')) continue;
      const v = t.type === 'goal_dep' ? t.amount : -t.amount;
      if(t.source === 'cash') cash += v; else card += v;
    }
    g.card = Math.max(0, Math.round(card*100)/100);
    g.cash = Math.max(0, Math.round(cash*100)/100);
    g.saved = Math.round((g.card + g.cash)*100)/100;
  }
}
function persist(){
  syncGoals();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('⚠️ Nie udało się zapisać danych'); }
  render();
}

/* =====================================================================
   POMOCNICZE
   ===================================================================== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
const r2 = n => Math.round(n*100)/100;
const PLN = new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN'});
const fmt = n => PLN.format(r2(n) || 0);
const fmt0 = n => new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(n) + ' zł';
function parseAmt(v){ const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n) ? r2(n) : NaN; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function monthLabel(k){ const [y,m] = k.split('-').map(Number); return cap(new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))); }
function monthShort(k){ const [y,m] = k.split('-').map(Number); return new Intl.DateTimeFormat('pl-PL',{month:'short'}).format(new Date(y,m-1,1)).replace('.',''); }
function shiftMonth(k, d){ const [y,m] = k.split('-').map(Number); return monthKey(new Date(y, m-1+d, 1)); }
const dShort = iso => new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'short'}).format(new Date(iso));
function dayLabel(iso){
  const d = new Date(iso), t = new Date(); const y = new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString() === t.toDateString()) return 'Dzisiaj';
  if(d.toDateString() === y.toDateString()) return 'Wczoraj';
  return cap(new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long'}).format(d));
}
function todayInput(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateFromInput(v){
  if(!v) return new Date().toISOString();
  const [y,m,d] = v.split('-').map(Number); const n = new Date();
  return new Date(y, m-1, d, n.getHours(), n.getMinutes(), n.getSeconds()).toISOString();
}
function addTx(t){ S.tx.push({ id: uid(), date: new Date().toISOString(), ...t }); }
function plural(n, one, few, many){
  if(n === 1) return one;
  const d = n % 10, dd = n % 100;
  return (d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14)) ? few : many;
}
const sorted = arr => [...arr].sort((a,b) => new Date(b.date) - new Date(a.date));
const inMonth = (t, mk) => mk === 'all' || monthKey(new Date(t.date)) === mk;

/* kategorie */
const catById = id => S.cats.find(c => c.id === id) || null;
const catColor = c => c && c.slot !== null && c.slot !== undefined ? `var(--s${c.slot+1})` : (c ? 'var(--sx)' : 'var(--s0)');
function freeSlot(){ for(let i=0;i<8;i++) if(!S.cats.some(c => c.slot === i)) return i; return null; }

/* =====================================================================
   OBLICZENIA
   ===================================================================== */
function totals(){
  let inc=0, exp=0, sv=0, wd=0, un=0, expMonth=0, cash=0;
  const mk = monthKey(new Date());
  for(const t of S.tx){
    switch(t.type){
      case 'income': case 'adjust': inc += t.amount; break;
      case 'expense': exp += t.amount; if(monthKey(new Date(t.date)) === mk) expMonth += t.amount; break;
      case 'save': sv += t.amount; break;
      case 'withdraw': wd += t.amount; break;
      case 'unsave': un += t.amount; break;
      case 'cash_in': case 'cash_adj': cash += t.amount; break;
      case 'cash_out': cash -= t.amount; break;
      case 'goal_dep': if(t.source === 'cash') cash -= t.amount; break;
      case 'goal_wd':  if(t.source === 'cash') cash += t.amount; break;
    }
  }
  const full = r2(inc - exp - wd);
  const savings = r2(sv - wd - un);
  const planned = r2(S.goals.reduce((a,g) => a + g.card, 0));        // z karty – część pełnych środków
  const plannedCash = r2(S.goals.reduce((a,g) => a + g.cash, 0));    // z gotówki – poza budżetem
  const target = r2(S.goals.reduce((a,g) => a + g.target, 0));
  return { full, savings, planned, plannedCash, goalsSaved: r2(planned + plannedCash), target, free: r2(full - planned - savings), expMonth: r2(expMonth), cash: r2(cash) };
}

/* =====================================================================
   OPIS OPERACJI
   ===================================================================== */
const isCashOp = t => CATS_H.cash.includes(t.type) || ((t.type === 'goal_dep' || t.type === 'goal_wd') && t.source === 'cash');
const CATS_H = {
  expense: ['expense'], income: ['income','adjust'], savings: ['save','withdraw','unsave'],
  goals: ['goal','goal_dep','goal_wd'], cash: ['cash_in','cash_out','cash_adj'],
};
function meta(t){
  switch(t.type){
    case 'income':  return { e:'💰', c:'var(--c-full)', title: t.name || 'Wpływ', sub:'Wpływ', amt:'+'+fmt(t.amount), cls:'pos' };
    case 'adjust':  return { e:'⚖️', c:'var(--c-full)', title:'Korekta salda', sub:'Ustawienie kwoty', amt:(t.amount>=0?'+':'−')+fmt(Math.abs(t.amount)), cls:t.amount>=0?'pos':'neg' };
    case 'expense': {
      const c = catById(t.catId);
      return { e: t.emoji || '💸', c:'var(--c-exp)', title: t.name || 'Wydatek',
        sub: (c ? c.name : 'Bez kategorii') + (t.fromGoal ? ' · cel' : ''), amt:'−'+fmt(t.amount), cls:'neg' };
    }
    case 'save':    return { e:'🐷', c:'var(--c-save)', title:'Odłożono na oszczędności', sub:'Oszczędności', amt:'+'+fmt(t.amount), cls:'save' };
    case 'withdraw':return { e:'💸', c:'var(--c-save)', title: t.name || 'Wykorzystano z oszczędności', sub:'Z oszczędności', amt:'−'+fmt(t.amount), cls:'neg' };
    case 'unsave':  return { e:'↩️', c:'var(--c-save)', title:'Przywrócono do wolnych środków', sub:'Oszczędności', amt:fmt(t.amount), cls:'mut' };
    case 'goal_dep':return { e: t.emoji || '🎯', c:'var(--c-plan)', title: t.name, sub:'Wpłata na cel · ' + (t.source === 'cash' ? '💵 gotówka' : '💳 karta'), amt:'+'+fmt(t.amount), cls:'plan' };
    case 'goal_wd': return { e: t.emoji || '🎯', c:'var(--c-plan)', title: t.name, sub: t.source === 'cash' ? 'Zwrot z celu do 💵 gotówki' : 'Zwrot z celu do 💳 wolnych', amt:'−'+fmt(t.amount), cls:'mut' };
    case 'goal':    return { e: t.emoji || '🎯', c:'var(--c-plan)', title: t.name, sub: {add:'Nowy cel', done:'Cel zrealizowany ✓', del:'Cel usunięty'}[t.action] || 'Cel', amt:fmt(t.amount), cls:'mut' };
    case 'cash_in': return { e:'💵', c:'var(--c-cash)', title: t.name || 'Dodano gotówkę', sub:'Gotówka', amt:'+'+fmt(t.amount), cls:'pos' };
    case 'cash_out':return { e: t.emoji || '💵', c:'var(--c-cash)', title: t.name || 'Wydatek gotówką', sub:'Gotówka', amt:'−'+fmt(t.amount), cls:'neg' };
    case 'cash_adj':return { e:'⚖️', c:'var(--c-cash)', title:'Korekta gotówki', sub:'Gotówka', amt:(t.amount>=0?'+':'−')+fmt(Math.abs(t.amount)), cls:t.amount>=0?'pos':'neg' };
  }
  return { e:'•', c:'var(--muted)', title:'?', sub:'', amt:'', cls:'mut' };
}
function txRow(t, showDate=true){
  const m = meta(t);
  return `<button class="row" data-tx="${t.id}">
    <span class="ri" style="--c:${m.c}">${esc(m.e)}</span>
    <span class="rt"><b>${esc(m.title)}</b><small>${esc(m.sub)}${showDate ? ' · '+dShort(t.date) : ''}</small></span>
    <span class="ra ${m.cls}">${m.amt}</span></button>`;
}

/* =====================================================================
   RENDER
   ===================================================================== */
const $app = document.getElementById('app');
function render(){
  document.querySelectorAll('.nav-b').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  ({ dash:renderDash, goals:renderGoals, stats:renderStats, hist:renderHist })[view]();
}
function go(v){ view = v; render(); scrollTo(0,0); }

function tile(key, c, ic, label, val, sub=''){
  return `<button class="tile" data-open="${key}" style="--c:${c}">
    <span class="ic">${ic}</span><span class="lb">${label}</span>
    <span class="am ${val<0?'neg':''}">${fmt(val)}</span>${sub ? `<span class="sub">${sub}</span>` : ''}
    <span class="hint">›</span></button>`;
}
const pctOf = (a,b) => b > 0 ? Math.max(0, Math.min(100, a/b*100)) : 0;
function planTile(T){
  const n = S.goals.length;
  const missing = r2(S.goals.reduce((a,g) => a + Math.max(0, g.target - g.saved), 0));
  const p = pctOf(T.goalsSaved, T.target);
  const sub = !n ? 'brak celów'
    : missing > 0 ? `brakuje <b style="color:var(--text)">${fmt(missing)}</b>`
    : '🎉 wszystkie osiągnięte';
  return `<button class="tile" data-open="plan" style="--c:var(--c-plan)">
    <span class="ic">🎯</span><span class="lb">Zaplanowane</span>
    <span class="am">${fmt(T.goalsSaved)}</span>
    ${n ? `<span class="sub">z ${fmt(T.target)} · ${n} ${plural(n,'cel','cele','celów')}</span>
      <span class="prog ${missing<=0?'done':''}" style="margin-top:-2px;height:6px"><span style="width:${p}%"></span></span>` : ''}
    <span class="sub">${sub}</span>
    <span class="hint">›</span></button>`;
}

/* ---------- PULPIT ---------- */
function renderDash(){
  const T = totals();
  const base = Math.max(T.full, 0.0001);
  const hello = (() => { const h = new Date().getHours(); return h < 5 ? 'Dobranoc' : h < 12 ? 'Dzień dobry' : h < 18 ? 'Cześć' : 'Dobry wieczór'; })();
  const recent = sorted(S.tx.filter(t => t.type !== 'goal')).slice(0, 6);

  $app.innerHTML = `
  <header class="top">
    <div><p>${hello} 👋</p><h1>Mój budżet</h1></div>
    <button class="iconbtn" data-open="settings" aria-label="Ustawienia">⚙️</button>
  </header>

  <section class="tiles">
    <button class="tile big" data-open="full" style="--c:#fff">
      <span style="display:flex;align-items:center;gap:10px"><span class="ic">💼</span><span class="lb">Pełne środki</span></span>
      <span class="am ${T.full<0?'neg':''}">${fmt(T.full)}</span>
      <span class="seg-bar">
        ${T.free > 0 ? `<span style="width:${pctOf(T.free,base)}%;background:#6ee7b7"></span>` : ''}
        ${T.planned > 0 ? `<span style="width:${pctOf(T.planned,base)}%;background:#fcd34d"></span>` : ''}
        ${T.savings > 0 ? `<span style="width:${pctOf(T.savings,base)}%;background:#7dd3fc"></span>` : ''}
      </span>
      <span class="legend"><span><i style="background:#6ee7b7"></i>Wolne</span><span><i style="background:#fcd34d"></i>Cele</span><span><i style="background:#7dd3fc"></i>Oszczędności</span></span>
    </button>
    ${tile('free','var(--c-free)','✨','Wolne środki',T.free,'do wydania')}
    ${planTile(T)}
    ${tile('save','var(--c-save)','🐷','Oszczędności',T.savings,'odłożone')}
    ${tile('exp','var(--c-exp)','🧾','Wydatki',T.expMonth,'w tym miesiącu')}
  </section>

  <button class="cash" data-open="cash">
    <span class="ic">💵</span>
    <span class="t"><b>Gotówka</b><small>poza budżetem i statystykami</small></span>
    <span class="v" style="${T.cash<0?'color:var(--c-exp)':''}">${fmt(T.cash)}</span>
  </button>

  ${goalsDash(T)}

  <section class="sec">
    <div class="sec-h"><h2>Ostatnie operacje</h2>${S.tx.length ? '<button data-goto="hist">Historia ›</button>' : ''}</div>
    <div class="card">
      ${recent.length ? recent.map(t => txRow(t)).join('') :
        `<div class="empty"><span class="e">🌱</span>Zacznij od kafelka <b>Pełne środki</b><br>i wpisz kwotę, którą masz.</div>`}
    </div>
  </section>`;
}

function pinnedGoal(){ return S.goals.find(g => g.id === S.pin) || S.goals[0] || null; }
function goalsDash(T){
  const n = S.goals.length;
  if(!n) return `<section class="sec"><div class="sec-h"><h2>Twoje cele</h2></div>
    <button class="card gdash-empty" data-open="newgoal"><span>🎯</span><span><b>Nie masz jeszcze celów</b><small>Stuknij, aby dodać pierwszy</small></span><span class="plus">＋</span></button></section>`;
  const missing = r2(S.goals.reduce((a,g) => a + Math.max(0, g.target - g.saved), 0));
  const g = pinnedGoal(), p = pctOf(g.saved, g.target), left = Math.max(0, r2(g.target - g.saved));
  return `<section class="sec">
    <div class="sec-h"><h2>Twoje cele</h2><button data-goto="goals">Wszystkie ›</button></div>
    <div class="card gdash">
      <div class="gstats">
        <div><small>Liczba celów</small><b>${n}</b></div>
        <div><small>Potrzeba łącznie</small><b>${fmt0(T.target)}</b></div>
        <div><small>Brakuje</small><b style="color:${missing>0?'var(--c-plan)':'var(--c-free)'}">${missing>0 ? fmt0(Math.ceil(missing)) : '🎉 0 zł'}</b></div>
      </div>
      <div class="pin" data-goal="${g.id}">
        <div class="pin-h"><span class="ge">${esc(g.emoji)}</span>
          <span class="gt"><b>${esc(g.name)}</b><small>${fmt(g.saved)} z ${fmt(g.target)}</small></span>
          ${n > 1 ? `<button class="pick" data-pickgoal>Zmień ▾</button>` : ''}</div>
        <div class="prog ${p>=100?'done':''}"><span style="width:${p}%"></span></div>
        <div class="gi"><span>${left > 0 ? 'Do końca brakuje: <b>' + fmt(left) + '</b>' : '<span class="badge">🎉 Cel osiągnięty!</span>'}</span><span>${Math.floor(p)}%</span></div>
      </div>
    </div></section>`;
}
function sheetPickGoal(){
  const cur = pinnedGoal();
  openSheet(`${head('Który cel pokazywać?')}
    <div class="card">${S.goals.map(g => { const left = Math.max(0, r2(g.target - g.saved)); return `
      <button class="row" data-setpin="${g.id}"><span class="ri" style="--c:var(--c-plan)">${esc(g.emoji)}</span>
        <span class="rt"><b>${esc(g.name)}</b><small>${left > 0 ? 'brakuje ' + fmt(left) : '🎉 osiągnięty'} · ${Math.floor(pctOf(g.saved,g.target))}%</small></span>
        <span class="ra" style="color:var(--c-plan)">${cur && cur.id === g.id ? '✓' : ''}</span></button>`; }).join('')}</div>`, 'var(--c-plan)');
}

/* ---------- CELE ---------- */
function renderGoals(){
  const T = totals();
  const p = pctOf(T.planned, T.target);
  $app.innerHTML = `
    <header class="top"><div><p>Odkładaj krok po kroku</p><h1>Cele</h1></div>
      <button class="pill pri" data-open="newgoal">＋ Nowy cel</button></header>
    ${S.goals.length ? `
      <div class="gsum">
        <small>Odłożono na cele</small>
        <div class="v">${fmt(T.planned)} <span>z ${fmt(T.target)}</span></div>
        <div class="prog"><span style="width:${p}%"></span></div>
        <p>✨ Wolne środki do wpłaty: <b>${fmt(T.free)}</b></p>
      </div>
      ${S.goals.map(goalCard).join('')}`
    : `<div class="card"><div class="empty"><span class="e">🎯</span>Nie masz jeszcze celów.<br>Dodaj pierwszy — np. wakacje albo nowy telefon.
        <button class="btn" style="--c:var(--c-plan)" data-open="newgoal">＋ Dodaj cel</button></div></div>`}`;
}
function goalCard(g){
  const p = pctOf(g.saved, g.target), done = g.saved >= g.target;
  const left = r2(g.target - g.saved);
  return `<div class="gcard ${done?'done':''}">
    <div class="gh"><span class="ge">${esc(g.emoji)}</span>
      <span class="gt"><b>${esc(g.name)}</b><small>${fmt(g.saved)} z ${fmt(g.target)}${g.cash > 0 ? ' · 💵 ' + fmt0(g.cash) : ''}</small></span>
      <span class="pct" style="color:${done?'var(--c-free)':'var(--c-plan)'}">${Math.floor(p)}%</span></div>
    <div class="prog ${done?'done':''}"><span style="width:${p}%"></span></div>
    <div class="gi"><span>${done ? '<span class="badge">🎉 Cel osiągnięty!</span>' : 'Brakuje: <b>' + fmt(left) + '</b>'}</span><span>od ${dShort(g.created)}</span></div>
    <div class="gb"><button class="dep" data-dep="${g.id}">＋ Wpłać</button><button data-goal="${g.id}">Więcej ⋯</button></div>
  </div>`;
}

/* ---------- ANALIZA ---------- */
function expByCat(mk){
  const map = new Map();
  let total = 0, n = 0;
  for(const t of S.tx){
    if(t.type !== 'expense' || !inMonth(t, mk)) continue;
    const c = catById(t.catId); const k = c ? c.id : 'none';
    const g = map.get(k) || { key:k, cat:c, v:0, n:0 };
    g.v += t.amount; g.n++; map.set(k, g); total += t.amount; n++;
  }
  return { groups: [...map.values()].sort((a,b) => b.v - a.v), total: r2(total), n };
}
function renderStats(){
  const mk = A.month, cur = monthKey(new Date());
  const { groups, total, n } = expByCat(mk);
  const prev = expByCat(shiftMonth(mk, -1)).total;
  const [y,m] = mk.split('-').map(Number);
  const days = mk === cur ? new Date().getDate() : new Date(y, m, 0).getDate();
  const diff = prev > 0 ? Math.round((total - prev) / prev * 100) : null;

  // segmenty wykresu: kategorie z kolorem osobno, reszta → "Inne"
  const segs = []; let other = null;
  for(const g of groups){
    if(g.cat && (g.cat.slot === null || g.cat.slot === undefined)){
      other = other || { key:'other', label:'Inne', emoji:'📦', color:'var(--sx)', v:0, n:0 };
      other.v += g.v; other.n += g.n;
    } else segs.push({ key:g.key, label: g.cat ? g.cat.name : 'Bez kategorii', emoji: g.cat ? g.cat.emoji : '💸', color: catColor(g.cat), v:g.v, n:g.n });
  }
  if(other) segs.push(other);

  // 6 miesięcy
  const months = []; for(let i=5;i>=0;i--){ const k = shiftMonth(mk, -i); months.push({ k, v: expByCat(k).total }); }
  const maxM = Math.max(...months.map(x => x.v), 1);

  $app.innerHTML = `
    <header class="top"><div><p>Na co idą pieniądze</p><h1>Analiza</h1></div>
      <button class="pill" data-open="cats">🏷️ Kategorie</button></header>
    <div class="month">
      <button data-am="-1" aria-label="Poprzedni miesiąc">‹</button>
      <b>${monthLabel(mk)}</b>
      <button data-am="1" ${mk>=cur?'disabled':''} aria-label="Następny miesiąc">›</button>
    </div>
    <div class="sum">
      <div style="--c:var(--c-exp)"><small>Wydano</small><b>${fmt(total)}</b></div>
      <div style="--c:var(--c-exp)"><small>vs poprzedni miesiąc</small><b>${diff === null ? '—' : (diff > 0 ? '▲ +' : diff < 0 ? '▼ ' : '') + diff + '%'}</b>
        <em>${prev > 0 ? fmt(prev) : 'brak danych'}</em></div>
      <div style="--c:var(--c-full)"><small>Średnio dziennie</small><b>${fmt(total / days)}</b></div>
      <div style="--c:var(--c-full)"><small>Liczba wydatków</small><b>${n}</b></div>
    </div>

    ${total > 0 ? `
    <div class="list-h">Wydatki wg kategorii</div>
    <div class="card">
      <div class="donut-wrap">${donut(segs, total)}</div>
      ${segs.map(s => `<button class="crow" data-catx="${s.key}">
          <span class="dot" style="background:${s.color}"></span><span class="e">${esc(s.emoji)}</span>
          <span class="n"><b>${esc(s.label)}</b><small>${s.n} ${plural(s.n,'wydatek','wydatki','wydatków')}</small>
            <div class="track"><span style="width:${s.v/segs[0].v*100}%;background:${s.color}"></span></div></span>
          <span class="v"><b>${fmt(s.v)}</b><small>${(s.v/total*100).toFixed(s.v/total < .1 ? 1 : 0).replace('.',',')}%</small></span>
        </button>`).join('')}
    </div>` : `<div class="card" style="margin-top:16px"><div class="empty"><span class="e">📊</span>Brak wydatków w tym miesiącu.</div></div>`}

    <div class="list-h">Ostatnie 6 miesięcy</div>
    <div class="card">
      <div class="bars6">${months.map(x => `<button class="${x.k===mk?'on':''}" data-amk="${x.k}" aria-label="${monthLabel(x.k)}: ${fmt(x.v)}">
          ${x.k===mk ? `<span class="bv" style="bottom:calc(${x.v/maxM*100}% * .78 + 30px)">${fmt0(x.v)}</span>` : ''}
          <span class="b" style="height:calc(${x.v/maxM*100}% * .78)"></span><span class="ml">${monthShort(x.k)}</span></button>`).join('')}</div>
    </div>
    <p class="note">💵 Gotówka nie jest wliczana do analizy. Stuknij kategorię, aby zobaczyć jej wydatki, albo słupek, aby przejść do miesiąca.</p>`;
}
function donut(segs, total){
  const R = 80, C = 2 * Math.PI * R, GAP = segs.length > 1 ? 3 : 0;
  let off = 0;
  const circles = segs.map(s => {
    const len = s.v / total * C;
    const vis = Math.max(len - GAP, 0.5);
    const el = `<circle class="seg ${A.hl && A.hl!==s.key?'dim':''} ${A.hl===s.key?'hl':''}" data-hl="${s.key}" cx="100" cy="100" r="${R}"
      stroke="${s.color}" stroke-dasharray="${vis} ${C - vis}" stroke-dashoffset="${-off}"><title>${esc(s.label)}: ${fmt(s.v)}</title></circle>`;
    off += len; return el;
  }).join('');
  const h = segs.find(s => s.key === A.hl);
  return `<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Wykres wydatków według kategorii">${circles}</svg>
    <div class="ctr">${h
      ? `<small>${esc(h.emoji)} ${esc(h.label)}</small><b>${fmt(h.v)}</b><span>${Math.round(h.v/total*100)}% wydatków</span>`
      : `<small>Wydano</small><b>${fmt(total)}</b><span>stuknij wycinek</span>`}</div></div>`;
}

/* ---------- HISTORIA ---------- */
function renderHist(){
  const all = S.tx.filter(t => inMonth(t, H.month));
  const list = sorted(H.cat === 'all' ? all : H.cat === 'cash' ? all.filter(isCashOp) : all.filter(t => CATS_H[H.cat].includes(t.type)));
  const sum = types => r2(all.filter(t => types.includes(t.type)).reduce((a,t) => a + t.amount, 0));
  const cur = monthKey(new Date());

  let summary = '';
  if(H.cat === 'all') summary = sumGrid([
    ['Wpływy', sum(['income','adjust']), 'var(--c-full)'], ['Wydatki', sum(['expense']), 'var(--c-exp)'],
    ['Odłożono', sum(['save']), 'var(--c-save)'], ['Wpłaty na cele', sum(['goal_dep']), 'var(--c-plan)']]);
  else if(H.cat === 'expense') summary = sumGrid([['Wydano łącznie', sum(['expense']), 'var(--c-exp)'],
    ['Liczba wydatków', all.filter(t => t.type === 'expense').length, 'var(--c-exp)', true]]) +
    `<button class="btn sec2" data-goto="stats">📊 Zobacz analizę wg kategorii</button>`;
  else if(H.cat === 'income') summary = sumGrid([['Wpływy', sum(['income']), 'var(--c-full)'], ['Korekty salda', sum(['adjust']), 'var(--c-full)']]);
  else if(H.cat === 'savings'){ const s = sum(['save']), w = sum(['withdraw']), u = sum(['unsave']);
    summary = sumGrid([['Odłożono', s, 'var(--c-save)'], ['Wykorzystano', w, 'var(--c-exp)'], ['Przywrócono', u, 'var(--s0)'], ['Bilans', r2(s-w-u), 'var(--c-free)']]); }
  else if(H.cat === 'goals'){ const done = r2(all.filter(t => t.type==='goal' && t.action==='done').reduce((a,t)=>a+t.amount,0));
    summary = sumGrid([['Wpłacono', sum(['goal_dep']), 'var(--c-plan)'], ['Wycofano', sum(['goal_wd']), 'var(--s0)'], ['Zrealizowano', done, 'var(--c-free)']]); }
  else if(H.cat === 'cash') summary = sumGrid([['Dodano gotówki', sum(['cash_in']), 'var(--c-cash)'], ['Wydano gotówką', sum(['cash_out']), 'var(--c-exp)'],
    ['Wpłacono na cele', r2(all.filter(t => t.type==='goal_dep' && t.source==='cash').reduce((a,t)=>a+t.amount,0)), 'var(--c-plan)']]);

  let days = '', lastDay = '';
  for(const t of list){
    const dk = new Date(t.date).toDateString();
    if(dk !== lastDay){ if(lastDay) days += '</div>'; days += `<div class="day">${dayLabel(t.date)}</div><div class="card">`; lastDay = dk; }
    days += txRow(t, false);
  }
  if(lastDay) days += '</div>';

  const chips = [['all','Wszystko'],['expense','🧾 Wydatki'],['income','💰 Wpływy'],['savings','🐷 Oszczędności'],['goals','🎯 Cele'],['cash','💵 Gotówka']];
  $app.innerHTML = `
    <header class="top"><div><p>Twoje finanse</p><h1>Historia</h1></div></header>
    <div class="chips">${chips.map(([k,l]) => `<button class="chip ${H.cat===k?'on':''}" data-hcat="${k}">${l}</button>`).join('')}</div>
    <div class="month">
      <button data-m="-1" ${H.month==='all'?'disabled':''} aria-label="Poprzedni miesiąc">‹</button>
      <b>${H.month==='all' ? 'Cały okres' : monthLabel(H.month)}</b>
      <span style="display:flex">
        <button class="all" data-m="all">${H.month==='all' ? 'Ten miesiąc' : 'Wszystko'}</button>
        <button data-m="1" ${H.month==='all'||H.month>=cur?'disabled':''} aria-label="Następny miesiąc">›</button>
      </span>
    </div>
    ${summary}
    ${list.length ? `<div class="list-h">Operacje</div>${days}` :
      `<div class="card" style="margin-top:16px"><div class="empty"><span class="e">🗂️</span>Brak operacji w tym okresie.</div></div>`}`;
}
function sumGrid(items){
  return `<div class="sum">${items.map(([l,v,c,raw]) => `<div style="--c:${c}"><small>${l}</small><b>${raw ? v : fmt(v)}</b></div>`).join('')}</div>`;
}

const EXP_EMOJI = ['💸','🛒','🍔','☕','🍕','🚗','⛽','🚌','🏠','💡','📱','🎮','🎬','👕','💊','🎁','✈️','🐶','📚','💇','🍺','🏋️','💳','🔧'];
const GOAL_EMOJI = ['🎯','✈️','🏖️','🚗','🏠','💻','📱','🎁','💍','🎓','🛋️','🚲','🎸','⌚','🎄','🏥'];

function emojiPicker(list, sel){
  sel = sel || list[0];
  return `<label class="f">Ikona</label><div class="emojis" data-picker>
    ${list.map(e => `<button type="button" class="${e===sel?'on':''}" data-emoji="${e}">${e}</button>`).join('')}
  </div><input type="hidden" name="emoji" value="${esc(sel)}">`;
}
function bindPicker(form, onPick){
  const p = form.querySelector('[data-picker]'); if(!p) return;
  p.addEventListener('click', e => {
    const b = e.target.closest('[data-emoji]'); if(!b) return;
    p.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
    form.emoji.value = b.dataset.emoji; onPick && onPick();
  });
}
function setPicker(form, emoji){
  form.emoji.value = emoji;
  form.querySelectorAll('[data-emoji]').forEach(b => b.classList.toggle('on', b.dataset.emoji === emoji));
}
function catPicker(sel, withAdd=true){
  return `<label class="f">Kategoria</label><div class="cats" data-catpick>
    <button type="button" class="${!sel?'on':''}" data-cat="" style="--c:var(--s0)">Bez kategorii</button>
    ${S.cats.map(c => `<button type="button" class="${sel===c.id?'on':''}" data-cat="${c.id}" style="--c:${catColor(c)}"><span class="dot" style="background:${catColor(c)}"></span>${esc(c.emoji)} ${esc(c.name)}</button>`).join('')}
    ${withAdd ? `<button type="button" class="add" data-addcat>＋ Nowa</button>` : ''}
  </div>`;
}
function bindCatPicker(root, onPick){
  const p = root.querySelector('[data-catpick]'); if(!p) return;
  p.addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if(!b) return;
    p.querySelectorAll('[data-cat]').forEach(x => x.classList.toggle('on', x === b));
    onPick(b.dataset.cat || null);
  });
}
function formErr(form, msg){ const el = form.querySelector('.err'); if(el) el.textContent = msg; }
function getAmt(form, field='amount', allowZero=false){
  const v = parseAmt(form[field].value);
  if(isNaN(v) || v < 0 || (!allowZero && v === 0)){ formErr(form, 'Podaj poprawną kwotę'); form[field].focus(); return null; }
  return v;
}
function segSwitch(root){
  root.querySelectorAll('[data-seg]').forEach(b => b.addEventListener('click', () => {
    root.querySelectorAll('[data-seg]').forEach(x => x.classList.toggle('on', x === b));
    root.querySelectorAll('[data-pane]').forEach(p => p.classList.toggle('hidden', p.dataset.pane !== b.dataset.seg));
  }));
}
const setAmt = (input, v) => input.value = String(r2(v)).replace('.', ',');

/* --- Pełne środki --- */

    <div class="seg"><button class="on" data-seg="add">➕ Dodaj wpływ</button><button data-seg="set">✏️ Ustaw kwotę</button></div>
    <form data-pane="add" id="fAdd">
      <label class="f">Skąd? (opcjonalnie)</label><input class="in" name="name" placeholder="np. Wypłata, Premia, Zwrot" maxlength="40">
      ${amtField()}
      <div class="err"></div><button class="btn">Dodaj do środków</button>
    </form>
    <form data-pane="set" id="fSet" class="hidden">

/* --- Wolne środki --- */
function sheetFree(){
  const T = totals();
  openSheet(`${head('✨ Wolne środki')}
    ${bal('Możesz swobodnie wydać', T.free, 'Pełne środki minus cele i oszczędności')}
    <form id="fSave">

      <div class="err"></div><button class="btn">🐷 Przenieś do oszczędności</button>
    </form>
    ${S.goals.length ? `<button class="btn sec2" data-dep="">🎯 Wpłać na cel</button>` : ''}
  `, 'var(--c-free)');
  const f = $('#fSave');
  f.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => setAmt(f.amount, T.free * b.dataset.p / 100)));

/* --- Cele: nowy --- */
function sheetNewGoal(){
  openSheet(`${head('🎯 Nowy cel')}
    <form id="fGoal">
      ${emojiPicker(GOAL_EMOJI)}
      <label class="f">Nazwa celu</label><input class="in" name="name" placeholder="np. Wakacje, Nowy telefon" maxlength="40">
      ${amtField('target','Ile potrzebujesz?')}
      ${amtField('first','Wpłać od razu (opcjonalnie)')}
      ${srcSeg()}
      <div class="err"></div><button class="btn">Utwórz cel</button>
    </form>`, 'var(--c-plan)');
  const f = $('#fGoal'); bindPicker(f);
  let src = 'card'; bindSrc(f, v => src = v);
  f.addEventListener('submit', e => { e.preventDefault();
    const name = f.name.value.trim(); if(!name){ formErr(f, 'Wpisz nazwę celu'); f.name.focus(); return; }
    const target = getAmt(f, 'target'); if(target === null) return;
    let first = 0;
    if(f.first.value.trim()){ first = getAmt(f, 'first', true); if(first === null) return; }
    if(first > 0){ const er = srcErr(src, first); if(er) return formErr(f, er); }
    if(first > target + 0.001) return formErr(f, 'Pierwsza wpłata jest większa niż cel');
    const g = { id: uid(), name, emoji: f.emoji.value, target, created: new Date().toISOString() };
    S.goals.push(g);
    addTx({ type:'goal', action:'add', goalId:g.id, name, emoji:g.emoji, amount:target });
    if(first > 0) addTx({ type:'goal_dep', goalId:g.id, name, emoji:g.emoji, amount:first, source:src });
    closeSheet(); view = 'goals'; persist(); toast('🎯 Dodano cel „' + name + '”');
  });
}

/* --- źródło pieniędzy: karta / gotówka --- */
function srcSeg(sel='card'){
  return `<label class="f">Skąd wziąć pieniądze?</label><div class="seg" data-src style="--c:var(--c-plan)">
    <button type="button" class="${sel==='card'?'on':''}" data-srcv="card">💳 Karta</button>
    <button type="button" class="${sel==='cash'?'on':''}" data-srcv="cash">💵 Gotówka</button></div>`;
}
function bindSrc(root, on){
  const box = root.querySelector('[data-src]'); if(!box) return;
  box.addEventListener('click', e => {
    const b = e.target.closest('[data-srcv]'); if(!b) return;
    box.querySelectorAll('[data-srcv]').forEach(x => x.classList.toggle('on', x === b)); on(b.dataset.srcv);
  });
}
function srcErr(src, a){
  const T = totals();
  if(src === 'cash') return a > T.cash + 0.001 ? 'Masz tylko ' + fmt(T.cash) + ' w gotówce' : '';
  return a > T.free + 0.001 ? 'Masz tylko ' + fmt(T.free) + ' wolnych środków' : '';
}

/* --- Cele: wpłata --- */
function sheetDeposit(goalId){
  if(!S.goals.length){ sheetNewGoal(); return; }
  let gid = goalId || S.goals[0].id, src = 'card';
  const T = totals();
  const draw = () => {
    const g = S.goals.find(x => x.id === gid);
    const left = Math.max(0, r2(g.target - g.saved));
    openSheet(`${head('＋ Wpłata na cel')}
      ${srcSeg(src)}
      ${goalId ? '' : `<label class="f">Na który cel?</label><div class="cats" id="gpick">
        ${S.goals.map(x => `<button type="button" class="${x.id===gid?'on':''}" data-g="${x.id}" style="--c:var(--c-plan)">${esc(x.emoji)} ${esc(x.name)}</button>`).join('')}</div>`}
      <div class="gcard" style="margin-top:14px;box-shadow:none;border:1.5px solid var(--line)">
        <div class="gh"><span class="ge">${esc(g.emoji)}</span><span class="gt"><b>${esc(g.name)}</b><small>${fmt(g.saved)} z ${fmt(g.target)}</small></span>
        <span class="pct" style="color:var(--c-plan)">${Math.floor(pctOf(g.saved,g.target))}%</span></div>
        <div class="prog"><span style="width:${pctOf(g.saved,g.target)}%"></span></div>
      </div>
      <form id="fDep">
        <p class="note" id="srcInfo"></p>
        ${amtField()}
        <div class="quick">${left > 0 ? `<button type="button" data-q="${left}">Brakująca kwota (${fmt0(Math.ceil(left))})</button>` : ''}
          ${[50,100,200,500].map(v => `<button type="button" data-q="${v}">${v} zł</button>`).join('')}</div>
        <div class="err"></div><button class="btn">Wpłać na „${esc(g.name)}”</button>
      </form>`, 'var(--c-plan)');
    $sh.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { gid = b.dataset.g; draw(); }));
    const f = $('#fDep');
    const info = () => $('#srcInfo').innerHTML = src === 'cash'
      ? '💵 Zostanie odjęte z gotówki — masz <b>' + fmt(T.cash) + '</b>'
      : '💳 Zostanie odjęte z wolnych środków — masz <b>' + fmt(T.free) + '</b>';
    bindSrc($sh, v => { src = v; info(); }); info();
    f.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => setAmt(f.amount, +b.dataset.q)));
    f.addEventListener('submit', e => { e.preventDefault();
      const a = getAmt(f); if(a === null) return;
      const er = srcErr(src, a); if(er) return formErr(f, er);
      if(a > left + 0.001) return formErr(f, left > 0 ? 'Do celu brakuje tylko ' + fmt(left) : 'Ten cel jest już osiągnięty 🎉');
      addTx({ type:'goal_dep', goalId:g.id, name:g.name, emoji:g.emoji, amount:a, source:src });
      closeSheet(); persist();
      toast(g.saved >= g.target ? '🎉 Cel „' + g.name + '” osiągnięty!' : '🎯 Wpłacono ' + fmt(a));
    });
  };
  draw();

function sheetGoalDone(id){

      <button type="button" class="btn sec2" data-back>Wróć</button>
    </form>`, 'var(--c-plan)');
  const f = $('#fDone'); setAmt(f.amount, g.saved || g.target);
  bindCatPicker(f, c => cat = c);
  f.querySelector('[data-back]').addEventListener('click', () => sheetGoal(id));
  f.addEventListener('submit', e => { e.preventDefault();
    const a = getAmt(f, 'amount', true); if(a === null) return;
    const cashUsed = Math.min(a, g.cash), cardPart = r2(a - cashUsed), cashLeft = r2(g.cash - cashUsed);

    addTx({ type:'goal', action:'done', goalId:g.id, name:g.name, emoji:g.emoji, amount:a });
    closeSheet(); persist(); toast('🎉 Cel zrealizowany!');
  });
}

function sheetTx(id){
  const t = S.tx.find(x => x.id === id); if(!t) return;
  const m = meta(t);
  const when = cap(new Intl.DateTimeFormat('pl-PL',{dateStyle:'full',timeStyle:'short'}).format(new Date(t.date)));
  const g = t.goalId ? S.goals.find(x => x.id === t.goalId) : null;
  let note = '';
  if(t.type === 'goal') note = 'To tylko notatka w historii — usunięcie nie zmienia celów ani sald.';
  else if(t.type === 'goal_dep') note = g ? 'Usunięcie cofnie tę wpłatę z celu.' : 'Cel już nie istnieje.';
  else if(t.type === 'goal_wd') note = g ? 'Usunięcie przywróci tę kwotę na cel.' : 'Cel już nie istnieje.';
  openSheet(`${head('Szczegóły')}
    <div class="detail"><div class="e">${esc(m.e)}</div><h4>${esc(m.title)}</h4>
      <div class="v ra ${m.cls}">${m.amt}</div><p>${esc(m.sub)}</p><p>${when}</p>
      ${note ? `<p style="margin-top:10px;font-size:12.5px">${note}</p>` : ''}</div>
    ${t.type === 'expense' ? `<div id="txCat">${catPicker(t.catId, false)}</div>` : ''}
    <button class="btn ghost" id="delTx">🗑️ Usuń wpis</button>`, m.c);
  if(t.type === 'expense') bindCatPicker($('#txCat'), c => { t.catId = c; persist(); toast('Zmieniono kategorię'); sheetTx(id); });
  $('#delTx').addEventListener('click', () => {
    if(!confirm('Na pewno usunąć ten wpis? Salda zostaną przeliczone.')) return;
    S.tx = S.tx.filter(x => x.id !== id); closeSheet(); persist(); toast('Usunięto wpis');

}

const OPEN = { full:sheetFull, free:sheetFree, plan:() => go('goals'), save:sheetSave, exp:sheetExp,

document.addEventListener('click', e => {
  const t = e.target;
  let el;
  if(el = t.closest('[data-open]')){ OPEN[el.dataset.open](); return; }
  if(t.closest('[data-close]')){ closeSheet(); return; }
  if(t.closest('[data-pickgoal]')){ sheetPickGoal(); return; }
  if(el = t.closest('[data-setpin]')){ S.pin = el.dataset.setpin; closeSheet(); persist(); return; }
  if(el = t.closest('[data-dep]')){ sheetDeposit(el.dataset.dep || null); return; }
  if(el = t.closest('[data-goal]')){ sheetGoal(el.dataset.goal); return; }
  if(el = t.closest('[data-tx]')){ sheetTx(el.dataset.tx); return; }
  if(el = t.closest('[data-goto]')){ closeSheet(); go(el.dataset.goto); return; }
  if(el = t.closest('[data-hcat]')){ H.cat = el.dataset.hcat; render(); return; }
  if(el = t.closest('[data-catx]')){ sheetCatList(el.dataset.catx); return; }
  if(el = t.closest('[data-hl]')){ A.hl = A.hl === el.dataset.hl ? null : el.dataset.hl; render(); return; }
  if(el = t.closest('[data-am]')){ A.month = shiftMonth(A.month, +el.dataset.am); A.hl = null; render(); return; }
  if(el = t.closest('[data-amk]')){ A.month = el.dataset.amk; A.hl = null; render(); return; }
  if(el = t.closest('[data-m]')){
    if(el.dataset.m === 'all') H.month = H.month === 'all' ? monthKey(new Date()) : 'all';
    else H.month = shiftMonth(H.month, +el.dataset.m);
    render(); return;
  }
  if(view === 'stats' && A.hl && !t.closest('.donut')){ A.hl = null; render(); }
});
document.querySelectorAll('.nav-b').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
document.getElementById('fab').addEventListener('click', sheetExp);

let tt;
function toast(msg){
  const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2200);
}

render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
